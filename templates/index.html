<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语作文自动批改系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f0ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8e8ff;
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
            color: #667eea;
        }

        .upload-text {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-hint {
            font-size: 0.9em;
            color: #666;
        }

        #file-input {
            display: none;
        }

        .file-info {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            border-left: 4px solid #4caf50;
        }

        .file-info.show {
            display: block;
        }

        .file-name {
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 5px;
        }

        .essay-count {
            color: #555;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #d0d0d0;
        }

        .status {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .status.show {
            display: block;
        }

        .status.loading {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .results {
            display: none;
            margin-top: 30px;
        }

        .results.show {
            display: block;
        }

        .result-item {
            background: #f8f9fa;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .essay-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }

        .essay-score {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .download-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #4caf50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .feature {
            text-align: center;
            color: white;
        }

        .feature-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .feature-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .feature-desc {
            font-size: 0.9em;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✏️ 英语作文自动批改系统</h1>
            <p>上传PDF文档，自动识别并批改作文，生成详细的Word批改报告</p>
        </div>

        <div class="card">
            <div class="upload-area" id="upload-area">
                <div class="upload-icon">📄</div>
                <div class="upload-text">点击或拖拽PDF文件到此处</div>
                <div class="upload-hint">支持多篇作文的PDF文档（最大16MB）</div>
                <input type="file" id="file-input" accept=".pdf">
            </div>

            <div class="file-info" id="file-info">
                <div class="file-name" id="file-name"></div>
                <div class="essay-count" id="essay-count"></div>
            </div>

            <div class="buttons">
                <button class="btn btn-secondary" id="reset-btn" disabled>重新选择</button>
                <button class="btn btn-primary" id="grade-btn" disabled>开始批改</button>
            </div>

            <div class="status" id="status"></div>

            <div class="results" id="results"></div>
        </div>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">🤖</div>
                <div class="feature-title">AI智能批改</div>
                <div class="feature-desc">基于DeepSeek API</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📊</div>
                <div class="feature-title">详细评分</div>
                <div class="feature-desc">多维度评分标准</div>
            </div>
            <div class="feature">
                <div class="feature-icon">✍️</div>
                <div class="feature-title">逐句批改</div>
                <div class="feature-desc">精准定位错误</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📝</div>
                <div class="feature-title">Word报告</div>
                <div class="feature-desc">专业格式输出</div>
            </div>
        </div>
    </div>

    <script>
        let uploadedFile = null;
        let uploadedFilename = null;

        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const fileInfo = document.getElementById('file-info');
        const fileName = document.getElementById('file-name');
        const essayCount = document.getElementById('essay-count');
        const resetBtn = document.getElementById('reset-btn');
        const gradeBtn = document.getElementById('grade-btn');
        const status = document.getElementById('status');
        const results = document.getElementById('results');

        // 点击上传区域
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 文件选择
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.pdf')) {
                handleFile(file);
            } else {
                showStatus('error', '请上传PDF文件');
            }
        });

        // 处理文件上传
        async function handleFile(file) {
            uploadedFile = file;
            showStatus('loading', '正在上传和识别作文...');
            results.classList.remove('show');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    uploadedFilename = data.filename;
                    fileName.textContent = `📄 ${file.name}`;
                    essayCount.textContent = `✅ ${data.message}`;
                    fileInfo.classList.add('show');
                    resetBtn.disabled = false;
                    gradeBtn.disabled = false;
                    showStatus('success', data.message);
                } else {
                    showStatus('error', data.error || '上传失败');
                    resetForm();
                }
            } catch (error) {
                showStatus('error', '网络错误: ' + error.message);
                resetForm();
            }
        }

        // 开始批改
        gradeBtn.addEventListener('click', async () => {
            if (!uploadedFilename) return;

            gradeBtn.disabled = true;
            resetBtn.disabled = true;
            results.classList.remove('show');
            showStatus('loading', '正在批改作文，请稍候...<div class="spinner"></div>');

            try {
                const response = await fetch('/grade', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        filename: uploadedFilename
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showStatus('success', '批改完成！');
                    displayResults(data.results);
                    gradeBtn.disabled = false;
                    resetBtn.disabled = false;
                } else {
                    showStatus('error', data.error || '批改失败');
                    gradeBtn.disabled = false;
                    resetBtn.disabled = false;
                }
            } catch (error) {
                showStatus('error', '网络错误: ' + error.message);
                gradeBtn.disabled = false;
                resetBtn.disabled = false;
            }
        });

        // 重置表单
        resetBtn.addEventListener('click', resetForm);

        function resetForm() {
            uploadedFile = null;
            uploadedFilename = null;
            fileInput.value = '';
            fileInfo.classList.remove('show');
            status.classList.remove('show');
            results.classList.remove('show');
            resetBtn.disabled = true;
            gradeBtn.disabled = true;
        }

        function showStatus(type, message) {
            status.className = 'status show ' + type;
            status.innerHTML = message;
        }

        function displayResults(resultsData) {
            results.innerHTML = '<h2 style="margin-bottom: 20px; color: #333;">批改结果</h2>';

            resultsData.forEach(result => {
                if (result.success) {
                    const resultItem = document.createElement('div');
                    resultItem.className = 'result-item';
                    resultItem.innerHTML = `
                        <div class="result-header">
                            <div class="essay-title">作文 #${result.essay_id}</div>
                            <div class="essay-score">${result.score}分</div>
                        </div>
                        <a href="/download/${result.output_file}" class="download-btn">📥 下载批改报告</a>
                    `;
                    results.appendChild(resultItem);
                } else {
                    const resultItem = document.createElement('div');
                    resultItem.className = 'result-item';
                    resultItem.style.borderLeftColor = '#dc3545';
                    resultItem.innerHTML = `
                        <div class="essay-title">作文 #${result.essay_id}</div>
                        <div style="color: #dc3545; margin-top: 10px;">❌ ${result.error}</div>
                    `;
                    results.appendChild(resultItem);
                }
            });

            results.classList.add('show');
        }

        // 检查健康状态
        async function checkHealth() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                if (!data.deepseek_configured) {
                    showStatus('error', '⚠️ 系统未配置DeepSeek API密钥，无法批改作文。请配置DEEPSEEK_API_KEY环境变量。');
                }
            } catch (error) {
                console.error('健康检查失败:', error);
            }
        }

        // 页面加载时检查
        checkHealth();
    </script>
</body>
</html>
